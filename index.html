    <style>
        :root {
            --bg-deep: #04070d; --bg-primary: #080c18; --bg-secondary: #0d1225; --bg-card: #111827; --bg-elevated: #151d33;
            --gold: #f0b90b; --gold-light: #fcd535; --gold-dark: #c9a84c; --blue: #3b82f6; --blue-light: #60a5fa;
            --green: #10b981; --green-light: #34d399; --green-bright: #05df72; --red: #ef4444; --red-light: #f87171;
            --purple: #8b5cf6; --purple-light: #a78bfa; --teal: #14b8a6; --teal-light: #2dd4bf; --pink: #ec4899;
            --pink-light: #f472b6; --orange: #f97316; --orange-light: #fb923c; --usdt-green: #26a17b;
            --usdt-green-light: #2ecc71; --text-primary: #e8eaed; --text-secondary: #9ca3af; --text-muted: #6b7280;

        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; overflow-x: hidden; }
        body { background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background-image: radial-gradient(ellipse at 15% 8%, rgba(38,161,123,0.05) 0%, transparent 55%), radial-gradient(ellipse at 85% 12%, rgba(240,185,11,0.04) 0%, transparent 55%), radial-gradient(ellipse at 50% 88%, rgba(16,185,129,0.05) 0%, transparent 55%); background-attachment: fixed; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg-primary); } ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }
        .usdt-logo { display: inline-block; width: 24px; height: 24px; vertical-align: middle; margin-right: 4px; background: var(--usdt-green); border-radius: 50%; position: relative; flex-shrink: 0; }
        .usdt-logo::after { content: '₮'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15px; font-weight: 900; color: white; font-family: 'Inter', sans-serif; }
        .usdt-logo-sm { width: 18px; height: 18px; } .usdt-logo-sm::after { font-size: 11px; }
        .usdt-logo-lg { width: 32px; height: 32px; } .usdt-logo-lg::after { font-size: 19px; }
        .top-bar { background: rgba(8,12,24,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(30,41,59,0.6); padding: 6px 0; font-size: 11px; }
        .top-bar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .live-dot { width: 7px; height: 7px; background: #05df72; border-radius: 50%; animation: livePulse 2s infinite; flex-shrink: 0; }
        @keyframes livePulse { 0%,100%{box-shadow:0 0 0 0 rgba(5,223,114,0.7)} 50%{box-shadow:0 0 0 7px rgba(5,223,114,0)} }
        nav { background: rgba(8,12,24,0.97); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 10px 0; }
        nav .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
        .nav-logo { width: 38px; height: 38px; background: linear-gradient(135deg, #c9a84c, #f0b90b, #fcd535); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: #080c18; box-shadow: 0 3px 14px rgba(240,185,11,0.25); flex-shrink: 0; }
        .nav-brand h1 { font-size: 17px; font-weight: 700; color: var(--white); white-space: nowrap; }
        .nav-brand span { font-size: 8px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); display: block; font-weight: 600; }
        .nav-actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
        .btn { padding: 9px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 12px; transition: all 0.25s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: inherit; }
        .btn:hover { transform: translateY(-1px); } .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #b89330, #f0b90b, #fcd535); color: #080c18; font-weight: 700; box-shadow: 0 3px 16px rgba(240,185,11,0.25); }
        .btn-outline { background: transparent; border: 1.5px solid var(--border-light); color: var(--text-primary); }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); background: rgba(240,185,11,0.04); }
        .btn-gold { background: transparent; border: 1.5px solid var(--gold); color: var(--gold); }
        .btn-sm { padding: 6px 14px; font-size: 11px; border-radius: 7px; } .btn-lg { padding: 12px 26px; font-size: 14px; border-radius: 10px; }
        .btn-xs { padding: 4px 10px; font-size: 10px; border-radius: 5px; }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981, #34d399); color: white; box-shadow: 0 3px 14px rgba(16,185,129,0.25); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444, #f87171); color: white; box-shadow: 0 3px 14px rgba(239,68,68,0.25); }
        .btn-info { background: linear-gradient(135deg, #1d4ed8, #3b82f6, #60a5fa); color: white; box-shadow: 0 3px 14px rgba(59,130,246,0.25); }
        .btn-purple { background: linear-gradient(135deg, #6d28d9, #8b5cf6, #a78bfa); color: white; }
        .btn-teal { background: linear-gradient(135deg, #0d9488, #14b8a6, #2dd4bf); color: white; }
        .btn-pink { background: linear-gradient(135deg, #be185d, #ec4899, #f472b6); color: white; }
        .btn-orange { background: linear-gradient(135deg, #c2410c, #f97316, #fb923c); color: white; }
        .btn-emerald { background: linear-gradient(135deg, #059669, #10b981, #2ecc71); color: white; box-shadow: 0 4px 20px rgba(16,185,129,0.35); font-weight: 700; }
        .card { background: var(--bg-card); border-radius: 14px; padding: 22px; border: 1px solid var(--border); transition: all 0.3s; }
        .card:hover { border-color: var(--border-light); }
        .card-accent { border-left: 3px solid var(--usdt-green); } .card-purple { border-left: 3px solid var(--purple); }
        .info-notice { background: rgba(59,130,246,0.06); border: 1px solid rgba(59,130,246,0.18); border-radius: 10px; padding: 10px 14px; font-size: 11px; color: var(--blue-light); display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .success-notice { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.25); border-radius: 12px; padding: 18px 20px; font-size: 13px; color: #e8eaed; display: flex; align-items: flex-start; gap: 12px; margin: 14px 0; }
        .success-notice i { color: var(--green-bright); font-size: 22px; flex-shrink: 0; margin-top: 2px; }
        .success-notice strong { color: var(--green-light); font-size: 14px; }
        .success-notice .highlight { color: var(--gold-light); font-weight: 700; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; } .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        @media (max-width: 900px) { .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 500px) { .grid-2,.grid-3,.grid-4 { grid-template-columns: 1fr; } }
        .vip-compact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; margin-top: 6px; }
        .vip-compact-card { background: var(--bg-elevated); border-radius: 12px; padding: 16px 14px; border: 1px solid var(--border); text-align: center; transition: all 0.3s; cursor: default; position: relative; overflow: hidden; }
        .vip-compact-card:hover { transform: translateY(-2px); border-color: var(--border-light); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .vip-compact-card.current { border: 2px solid var(--gold); background: linear-gradient(180deg, rgba(240,185,11,0.08) 0%, var(--bg-elevated) 100%); box-shadow: 0 0 16px rgba(240,185,11,0.08); }
        .vip-compact-card.popular-card { border: 2px solid var(--teal); background: linear-gradient(180deg, rgba(20,184,166,0.06) 0%, var(--bg-elevated) 100%); }
        .vip-compact-card .popular-ribbon { position: absolute; top: 0; right: 0; background: linear-gradient(135deg, #0d9488, #2dd4bf); color: #fff; font-size: 7px; font-weight: 800; padding: 5px 10px 5px 14px; letter-spacing: 1px; border-bottom-left-radius: 8px; box-shadow: 0 2px 6px rgba(20,184,166,0.4); z-index: 1; }
        .vip-compact-card .vip-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-bottom: 7px; }
        .vip-compact-card .vip-level { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
        .vip-compact-card .vip-cost { font-size: 19px; font-weight: 800; }
        .vip-compact-card .vip-detail { font-size: 10px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
        .vip-compact-card .vip-detail strong { color: var(--text-primary); }
        .vip-compact-card.current::after { content: 'CURRENT'; display: block; font-size: 8px; font-weight: 700; color: var(--gold); margin-top: 7px; letter-spacing: 1.5px; }
        .vip-full-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 14px; }
        .vip-full-card { background: var(--bg-card); border-radius: 14px; padding: 20px 16px; border: 1px solid var(--border); text-align: center; transition: all 0.3s; position: relative; overflow: hidden; }
        .vip-full-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .vip-full-card.popular-card { border: 2.5px solid var(--teal); background: linear-gradient(180deg, rgba(20,184,166,0.08) 0%, rgba(20,184,166,0.02) 50%, var(--bg-card) 100%); box-shadow: 0 0 30px rgba(20,184,166,0.15), 0 4px 20px rgba(0,0,0,0.3); }
        .vip-full-card .popular-badge-top { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #0d9488, #2dd4bf); color: #fff; font-size: 10px; font-weight: 800; padding: 8px 20px; border-radius: 0 0 12px 12px; letter-spacing: 1.5px; box-shadow: 0 4px 12px rgba(20,184,166,0.5); z-index: 2; }
        .vip-full-card .vip-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 18px; }
        .vip-full-card .vip-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .vip-full-card .vip-price { font-size: 24px; font-weight: 800; margin: 5px 0; }
        .vip-full-card .vip-info { font-size: 11px; color: var(--text-secondary); line-height: 1.7; }
        .vip-full-card .vip-info strong { color: var(--text-primary); }
        .stat-box { background: var(--bg-elevated); border-radius: 12px; padding: 16px; text-align: center; border: 1px solid var(--border); transition: all 0.3s; }
        .stat-box:hover { transform: translateY(-2px); }
        .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; font-size: 15px; }
        .stat-value { font-size: 22px; font-weight: 800; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; font-weight: 600; }
        .icon-gold { background: rgba(240,185,11,0.15); color: var(--gold-light); } .icon-blue { background: rgba(59,130,246,0.15); color: var(--blue-light); }
        .icon-green { background: rgba(38,161,123,0.15); color: var(--usdt-green-light); } .icon-purple { background: rgba(139,92,246,0.15); color: var(--purple-light); }
        .icon-pink { background: rgba(236,72,153,0.15); color: var(--pink-light); } .icon-teal { background: rgba(20,184,166,0.15); color: var(--teal-light); }
        .icon-red { background: rgba(239,68,68,0.15); color: var(--red-light); } .icon-orange { background: rgba(249,115,22,0.15); color: var(--orange-light); }
        .balance-display { font-size: 40px; font-weight: 800; letter-spacing: -1px; line-height: 1; background: linear-gradient(135deg, #26a17b 0%, #2ecc71 40%, #54d98c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-flex; align-items: center; gap: 7px; }
        @media (max-width: 500px) { .balance-display { font-size: 30px; } }
        .balance-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
        .yield-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 600; }
        .yield-active { background: rgba(38,161,123,0.12); color: var(--usdt-green-light); border: 1px solid rgba(38,161,123,0.25); }
        .yield-inactive { background: rgba(239,68,68,0.08); color: var(--red-light); border: 1px solid rgba(239,68,68,0.2); }
        .yield-high { background: rgba(240,185,11,0.12); color: var(--gold-light); border: 1px solid rgba(240,185,11,0.25); }
        .yield-premium { background: rgba(236,72,153,0.12); color: var(--pink-light); border: 1px solid rgba(236,72,153,0.25); }
        .rate-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
        .rate-low { background: rgba(16,185,129,0.1); color: var(--green-light); border: 1px solid rgba(16,185,129,0.3); }
        .rate-mid { background: rgba(240,185,11,0.1); color: var(--gold-light); border: 1px solid rgba(240,185,11,0.3); }
        .rate-high { background: rgba(236,72,153,0.1); color: var(--pink-light); border: 1px solid rgba(236,72,153,0.3); }
        .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
        @media (max-width: 600px) { .quick-actions { grid-template-columns: repeat(2, 1fr); } }
        .quick-action-btn { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; gap: 7px; }
        .quick-action-btn:hover { transform: translateY(-2px); border-color: var(--border-light); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .quick-action-btn .qa-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .quick-action-btn .qa-label { font-size: 11px; font-weight: 600; color: var(--text-primary); }
        h2 { font-size: 19px; font-weight: 700; } h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-secondary); margin-bottom: 10px; }
        .text-gold { color: var(--gold-light); } .text-green { color: var(--usdt-green-light); } .text-blue { color: var(--blue-light); }
        .text-purple { color: var(--purple-light); } .text-teal { color: var(--teal-light); } .text-muted { color: var(--text-muted); font-size: 11px; }
        .masked-text { font-family: 'SF Mono', monospace; letter-spacing: 1.5px; color: var(--text-muted); user-select: none; font-size: 12px; }
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 50px; font-size: 10px; font-weight: 600; }

        .badge-green { background: rgba(38,161,123,0.12); color: var(--usdt-green-light); border: 1px solid rgba(38,161,123,0.3); }
        .badge-purple { background: rgba(139,92,246,0.12); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.3); }
        .badge-teal { background: linear-gradient(135deg, #0d9488, #14b8a6); color: #fff; border: 1px solid rgba(20,184,166,0.4); font-size: 11px; padding: 6px 14px; }
        .security-notice { background: rgba(240,185,11,0.04); border: 1px solid rgba(240,185,11,0.15); border-radius: 10px; padding: 11px 15px; font-size: 11px; color: var(--gold-light); display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .wallet-display-box { background: var(--bg-primary); padding: 14px; border-radius: 10px; border: 1px solid var(--border); font-family: 'SF Mono', monospace; font-size: 12px; word-break: break-all; position: relative; margin: 8px 0; }
        .wallet-display-box .copy-btn { position: absolute; top: 7px; right: 7px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: 600; }
        .wallet-display-box .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
        .chat-fab { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #c9a84c, #f0b90b); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 999; box-shadow: 0 5px 22px rgba(240,185,11,0.35); }
        .chat-fab i { color: #080c18; font-size: 18px; }
        .chat-window { position: fixed; bottom: 78px; right: 20px; width: 380px; max-width: calc(100vw - 28px); max-height: 500px; background: var(--bg-card); border-radius: 16px; display: none; flex-direction: column; z-index: 1000; border: 1px solid var(--border-light); box-shadow: 0 22px 55px rgba(0,0,0,0.6); overflow: hidden; }
        @media (max-width: 400px) { .chat-window { width: calc(100vw - 20px); right: 10px; bottom: 70px; max-height: 420px; } }
        .chat-header { background: var(--bg-elevated); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
        .chat-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #c9a84c, #f0b90b); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #080c18; font-size: 12px; flex-shrink: 0; }
        .chat-header h4 { font-size: 12px; } .chat-header .online-status { font-size: 9px; color: var(--usdt-green-light); }
        .chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; max-height: 340px; }
        .chat-msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; font-size: 11.5px; line-height: 1.6; animation: msgIn 0.35s; }
        @keyframes msgIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
        .chat-msg.agent { background: var(--bg-elevated); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        .chat-msg.user { background: linear-gradient(135deg, #c9a84c, #f0b90b); align-self: flex-end; border-bottom-right-radius: 4px; color: #080c18; font-weight: 500; }

        .typing-dots { display: flex; gap: 3px; padding: 4px 0; }

        .footer a, .footer p { display: block; color: var(--text-muted); font-size: 11px; margin-bottom: 6px; cursor: pointer; }
